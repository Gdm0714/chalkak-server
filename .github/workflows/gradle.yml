name: Deploy to OCI

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Trigger deploy on OCI
        env:
          PRIVATE_KEY: ${{ secrets.OCI_SSH_KEY }}
          HOST: ${{ secrets.OCI_HOST }}
          USER: ${{ secrets.OCI_USER }}
        run: |
          set -e
          echo "🚀 OCI 배포 시작 ($HOST)..."

          echo "$PRIVATE_KEY" > private_key.pem
          chmod 600 private_key.pem

          # OCI 서버에서 git pull → app 이미지 재빌드 → app 컨테이너만 재기동
          # (mysql/redis/caddy 및 DB 데이터는 유지 — /opt/chalkak/deploy.sh 내부에서 처리)
          ssh -i private_key.pem -o StrictHostKeyChecking=no -o ServerAliveInterval=30 \
            "$USER@$HOST" 'bash /opt/chalkak/deploy.sh'

          echo "✅ 배포 완료"

      - name: Cleanup SSH key
        if: always()
        run: rm -f private_key.pem

      - name: Smoke test
        if: success()
        run: |
          echo "헬스 체크..."
          for i in 1 2 3 4 5; do
            if curl -fsS https://api.chalkak.co.kr/actuator/health | grep -q '"status":"UP"'; then
              echo "✅ 헬스 체크 통과"
              exit 0
            fi
            echo "재시도 ${i}/5..."
            sleep 6
          done
          echo "❌ 헬스 체크 실패"
          exit 1

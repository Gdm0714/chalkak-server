name: Deploy to EC2

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger deploy on EC2
        env:
          PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER }}
        run: |
          set -e
          echo "🚀 EC2 배포 시작 ($HOST)..."

          echo "$PRIVATE_KEY" > private_key.pem
          chmod 600 private_key.pem

          # 서버에서 git pull → docker build → 무중단 재시작 (Docker 기반)
          ssh -i private_key.pem -o StrictHostKeyChecking=no -o ServerAliveInterval=30 \
            $USER@$HOST 'bash /opt/chalkak/repo/infra/deploy.sh'

          echo "✅ 배포 완료"

      - name: Cleanup SSH key
        if: always()
        run: rm -f private_key.pem

      - name: Smoke test
        if: success()
        run: |
          echo "헬스 체크..."
          for i in 1 2 3 4 5; do
            if curl -fsS https://api.chalkak.co.kr/actuator/health | grep -q '"status":"UP"'; then
              echo "✅ 헬스 체크 통과"
              exit 0
            fi
            echo "재시도 ${i}/5..."
            sleep 6
          done
          echo "❌ 헬스 체크 실패"
          exit 1

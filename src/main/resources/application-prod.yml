spring:
  # JPA/Hibernate Configuration for Production
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}  # 빈 DB 첫 배포 시 update, 안정화 후 validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  # Cache Configuration - Redis (프로덕션에서는 Redis 필수)
  cache:
    type: redis

# Logging
logging:
  level:
    root: INFO
    com.min.chalkakserver: INFO
    org.hibernate.SQL: WARN

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  # 외부 의존성 health 체크 비활성화 (placeholder 자격증명으로 false positive 방지).
  # db/redis/디스크/ping이 실제 가용성을 커버.
  health:
    mail:
      enabled: false
    ssl:
      enabled: false
